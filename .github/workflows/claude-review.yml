name: Claude review

on:
  pull_request:
    # No `synchronize`: one review per PR at open. For a deliberate re-review after
    # addressing findings, convert the PR to draft and back to ready.
    types: [opened, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request against the rules in CLAUDE.md. Order of concern:
            1. Security — SQL built from request data, jwt.decode, secrets reaching the
               client, dangerouslySetInnerHTML, tokens in URLs or logs, unescaped CSV.
            2. Correctness — off-by-one, race conditions, unhandled non-2xx responses,
               stale React closures, mixed date formats.
            3. Missing tests for any route that changed.
            4. Structure — does the next engineer wince?
            Skip style; ESLint owns that.

            For each finding: point at the line, say what breaks, say how you'd verify it.
            If there is nothing important, say so in one line — do not invent findings.

            Post one top-level summary with `gh pr comment`. Use inline comments only for
            concrete, line-anchored issues.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
